<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Matekgyakorló</title><link rel="stylesheet" href="style.css"><!-- MATEK-CACHE-START -->
<script>
(() => {
  const versionFile = new URL('version.json', document.baseURI);
  const current = '20261114170903';
  let refreshing = false;
  async function checkVersion() {
    if (refreshing) return;
    try {
      const response = await fetch(versionFile.href + '?t=' + Date.now(), {
        cache: 'no-store'
      });
      if (!response.ok) return;
      const data = await response.json();
      if (data.version && data.version !== current) {
        refreshing = true;
        const url = new URL(location.href);
        url.searchParams.set('site_version', data.version);
        location.replace(url.href);
      }
    } catch (_) { /* Offline: keep the page usable. */ }
  }
  window.addEventListener('pageshow', checkVersion);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkVersion();
  });
  window.addEventListener('focus', checkVersion);
  setInterval(() => {
    if (!document.hidden) checkVersion();
  }, 60000);
})();
</script>
<!-- MATEK-CACHE-END -->
</head><body>
<main id="home" class="home"><h1>🧮 Matekgyakorló</h1><p>Válassz gyakorlófeladatot!</p><div class="toolbar"><label>Évfolyam<select id="grade"><option value="all">Összes</option><option value="1">1. osztály</option><option value="2">2. osztály</option></select></label><label>Tantárgy<select id="subject"><option value="all">Összes</option></select></label><label>Témakör<select id="topic"><option value="all">Összes</option></select></label></div><div class="mode-grid" id="exerciseList"></div></main>
<script type="module" src="js/home.js?v=20261114170903"></script></body></html>
