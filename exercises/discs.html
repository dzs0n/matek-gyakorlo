<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Korongok felismerése – Matekgyakorló</title><link rel="stylesheet" href="../style.css?v=20261114170903"><!-- MATEK-CACHE-START -->
<script>
(() => {
  const versionFile = new URL('../version.js?v=20261114170903on', document.baseURI);
  const current = '20261114170903';
  let refreshing = false;
  async function checkVersion() {
    if (refreshing) return;
    try {
      const response = await fetch(versionFile.href + '?t=' + Date.now(), {
        cache: 'no-store'
      });
      if (!response.ok) return;
      const data = await response.json();
      if (data.version && data.version !== current) {
        refreshing = true;
        const url = new URL(location.href);
        url.searchParams.set('site_version', data.version);
        location.replace(url.href);
      }
    } catch (_) { /* Offline: keep the page usable. */ }
  }
  window.addEventListener('pageshow', checkVersion);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkVersion();
  });
  window.addEventListener('focus', checkVersion);
  setInterval(() => {
    if (!document.hidden) checkVersion();
  }, 60000);
})();
</script>
<!-- MATEK-CACHE-END -->
</head>
<body><header class="site-header"><div class="exercise-meta">Matematika · 1–2. évfolyam · Számfogalom · A tíz bontása</div></header>
<section id="discsView" class="practice-view" style="display:block" class="practice-view">
  <a class="back-button" href="../index.html" style="display:inline-block;text-decoration:none">← Főmenü</a>
  <div class="practice-panel">
    <div class="practice-head"><h2>Fordítsd át a korongokat!</h2><button id="newDiscs" class="secondary">⤨ Új feladat</button></div>
    <div id="discGrid" class="disc-grid" aria-label="Tíz piros és zöld korong"></div>
    <div id="discEquation" class="disc-equation" aria-live="polite">? + ? = 10</div>
    <button id="toggleDiscs" class="answer-toggle">Mutasd a választ</button>
    <div class="muted-note">Márk mondja meg, mennyi a piros és mennyi a zöld. A választ te fedheted fel.</div>
  </div>
</section>

<script type="module" src="../js/discs.js?v=20261114170903"></script></body></html>
